apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: heart-mlops}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: prometheus, namespace: heart-mlops}
rules:
  - apiGroups: [""]
    resources: [pods, endpoints, services]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: prometheus, namespace: heart-mlops}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus}
subjects:
  - {kind: ServiceAccount, name: prometheus, namespace: heart-mlops}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config, namespace: heart-mlops}
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      # discover every pod annotated prometheus.io/scrape=true (one series per replica)
      - job_name: heart-api-pods
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [heart-mlops]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: heart-mlops, labels: {app: prometheus}}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports: [{containerPort: 9090}]
          volumeMounts: [{name: config, mountPath: /etc/prometheus}]
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
      volumes:
        - {name: config, configMap: {name: prometheus-config}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: heart-mlops}
spec:
  type: NodePort
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: 9090, nodePort: 30090}]
